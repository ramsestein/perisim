[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perisim"
version = "0.3.0"
description = "PERISIM: kNN con métrica aprendida (SAGE multimodelo + NCA diagonal regularizado) para pacientes postoperatorios al alta de UCI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ramses Marrero García" }]

[project.scripts]
perisim = "perisim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
