# PERISIM — semillas, rutas, folds, tolerancias y rejillas (§5, §6, §9.1, §10).
# Los valores ${VAR:-defecto} se toman de variables de entorno (run_pod.sh las fija para KHDP).
# Todo lo que aquí se fija ANTES de ejecutar no se ajusta a la vista de los resultados (§5.3.2, §6.3).

project: perisim
seed: 20261021

paths:
  datasets_root: ${PERISIM_DATASETS:-/home/khdp-user/workspace/datasets}
  workdir: ${PERISIM_WORKDIR:-/home/khdp-user/workspace/updown/perisim/work}
  # "auto" = descubrimiento bajo datasets_root (src/perisim/data/discover.py)
  inspire_dir: ${PERISIM_INSPIRE_DIR:-auto}
  mimic_dir: ${PERISIM_MIMIC_DIR:-auto}
  eicu_dir: ${PERISIM_EICU_DIR:-auto}

resources:            # §9.1: 16 vCPU, 128 GB, 100 GB, sin GPU
  max_parallel_jobs: 4
  threads_per_job: 4
  min_free_disk_gb: 10
  discovery_max_depth: 7
  discovery_time_budget_s: 300

cohorts:
  development: inspire
  external: [mimic, eicu]
  # Si falta alguna cohorte montada, el modelado se para (la intersección de inputs no estaría definida).
  allow_missing_cohorts: false

time:
  cutoff_margin_hours: 2        # D2 (sensibilidad: 4 h, ver sensitivity)
  followup_days: 30

cv:
  outer_folds: 5
  inner_folds: 3
  temporal:
    enabled: auto               # auto = solo si stays.year existe en INSPIRE (§6.1 [VERIFICAR])
    train_years: [2011, 2018]
    test_years: [2019, 2020]

features:
  feature_set: core             # core (intersección 3 cohortes) | extended (INSPIRE ∩ MIMIC) | full (solo INSPIRE)
  max_missing_for_availability: 0.95
  missing_indicator_threshold: 0.05
  dx_min_prevalence: 0.005      # D6
  dx_window: before_surgery     # before_surgery (principal, §4.4.2) | before_cutoff (sensibilidad)
  med_window_hours: 24
  vital_window_hours: 24
  lab_lookback_hours: 72
  preop_lab_lookback_days: 180
  support_gap_hours: 6          # fusión de registros de soporte en intervalos (fin inferido por ausencia)
  min_points_slope: 3
  hier_min_count: 10
  hier_max_levels: 200
  nominal_min_count: 10
  nominal_max_categories: 50
  corr_cluster_threshold: 0.8   # §5.3.1
  block_group_threshold: 50     # §5.3.1 [decisión abierta]

importance:                     # §5.3
  epsilon: 0.05                 # filtro de competitividad (D7)
  n_explain: 2000
  augment_copies: 2             # copias con máscara aleatoria para el feature dropout
  stopping:                     # D7: W, P, n_min, n_max fijos; min_delta y tol_delta desde el piloto
    W: 5
    P: 10
    n_min: 20
    n_max: 150
    min_delta: auto             # auto = regla declarada en pilot.min_delta_rule
    tol_delta: 0.01
    max_attempts_factor: 3
  n_reference_pairs: 20000
  lambda_loop: 1.0              # λ de la conversión dentro del bucle de parada (el λ final se elige en CV interna)
  nca_epochs_per_iter: 3
  candidate_refresh_every: 5
  sage:
    batch_size: 512
    max_passes: 3
    convergence_threshold: 0.025
  variance_floor: 1.0e-8
  privileged_information: false # D8 (análisis secundario)

metric:                         # §5.2, §5.4
  vdm_m_grid: [1, 5, 20, 50]
  lambda_grid: [0, 0.01, 0.1, 1, 10, 100]
  n_candidates: 500
  nca:
    epochs: 30
    batch_size: 256
    lr: 0.05
    refresh_every: 5
    eps0: 1.0e-4
    label_smoothing: 1.0e-3

knn:                            # §5.5
  k_grid: [10, 20, 50, 100, 200]
  k_primary: 50                 # D11
  alpha_grid: [0, 0.1, 0.5, 1, 2, 5, 10]
  ood_percentile: 99

targets_to_model: [t1, t2, t3]
patient_output_target: t1       # métrica cuyos vecinos se usan en la salida clínica §5.6 (ver OPEN_QUESTIONS)

baselines: [euclidean, shap_lgbm, rf_importance, relieff, nca_diag, power_prior, rf_gap, logreg, lgbm, swift]

pilot:                          # §9.1, M3
  outer_fold: 0
  target: t1
  n_models: 60
  include_baselines: false
  # Regla declarada antes de ejecutar: min_delta = fracción × Δ̃ del piloto en la iteración n_min
  min_delta_rule:
    fraction_of_delta_at_nmin: 0.05
  mlp_cost_ratio_exclude: 3.0   # si la MLP cuesta >3× la mediana del resto, se excluye (§9.1)

gates:
  audit_stop_on_issues: true    # §7: parar si prevalencia <0,5 % o ausencia >30 %
  audit_acknowledged: ${PERISIM_ACK_AUDIT:-false}
  external_requires_freeze: true

evaluation:
  n_bootstrap: 2000
  small_cell_threshold: 10      # §9: celdas n < 10 se suprimen en lo exportable

sensitivity:                    # §4.2, §6.6 — se ejecutan tras la CV principal
  enabled: true
  variants:
    - name: margin_4h
      overrides: {experiment: {time: {cutoff_margin_hours: 4}}}
    - name: t1_sin_antibiotico
      overrides: {targets: {t1: {exclude_components: [antibiotic_course]}}}
    - name: t1_sin_lra
      overrides: {targets: {t1: {exclude_components: [aki_12, aki_3]}}}
    - name: kdigo_alternativo
      overrides: {targets: {kdigo: {ratio_stage1: 1.3, abs_increase_48h: 0.5}}}
    - name: t2_absoluta
      overrides: {targets: {t2: {categories: absolute}}}
    - name: dx_antes_del_corte
      overrides: {experiment: {features: {dx_window: before_cutoff}}}
    - name: hipoxemia_planta
      overrides: {targets: {t1: {include_sensitivity_components: [hypoxemia_ward]}}}
