# Criterios de inclusión y exclusión por cohorte (§3, propuesta v0).
# Aquí van VALORES de criterio; los nombres de columnas originales están en harmonization.yaml.

common:
  min_age: 18
  min_icu_hours: 4               # D3 [decisión abierta]
  icu_death_tolerance_min: 60    # muerte ≤ alta UCI + tolerancia ⇒ muerte en UCI
  discharge_tolerance_min: 60    # alta hospitalaria ≤ alta UCI + tolerancia ⇒ alta directa desde UCI (excluida)
  exclude_organ_donors: true
  exclude_known_limitation: true # solo si la cohorte lo registra [VERIFICAR disponibilidad]

inspire:
  role: development
  # icuin_time en las 24 h siguientes a opend_time (§3.1). Tolerancia negativa por desajustes de registro.
  postop_window_hours: 24
  postop_negative_tolerance_min: 60

mimic:
  role: external_full
  postop_rule: service_or_procedure     # D10 [VERIFICAR regla]
  service_lookback_min: 60              # servicio vigente en intime + 60 min
  surgical_services: [CSURG, NSURG, ORTHO, PSURG, SURG, TSURG, VSURG, GU, GYN, ENT, TRAUM, DENT]
  procedure_days_before: 1              # procedimiento en la fecha de ingreso en UCI o la anterior
  # ICD-10-PCS quirúrgico [VERIFICAR]: sección "0" (médico-quirúrgica), abordaje (5.º carácter)
  # abierto (0) o percutáneo endoscópico (4), excluyendo la operación raíz "2" (cambio).
  or_icd10_approaches: ["0", "4"]
  or_icd10_exclude_root_operations: ["2"]
  # ICD-9-CM: capítulos 01–86, excluyendo prefijos no quirúrgicos frecuentes [VERIFICAR]
  or_icd9_range: [1, 86]
  or_icd9_exclude_prefixes: ["389", "3995", "3891", "3893", "3324", "4513", "4516"]
  emergency_admission_types: ["EW EMER.", "URGENT", "DIRECT EMER.", "EMERGENCY"]

eicu:
  role: external_partial                # solo grave / no grave y estancia (§2.1)
  postop_admit_sources: ["Operating Room", "Recovery Room", "PACU"]
  postop_admitdx_patterns: ["(?i)\\|Operative\\|", "(?i)admitted from the O\\.R\\.[^|]*\\|Yes"]
  ward_discharge_locations: ["Floor", "Step-Down Unit (SDU)", "Telemetry", "Acute Care/Floor", "Other Internal"]
