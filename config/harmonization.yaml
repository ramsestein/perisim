# Variable map across cohorts (§4.1, §8.4).
# The ONLY place, together with src/perisim/data/, where original table, column and item names appear.
# status: VERIFIED | VERIFY. Everything starts as VERIFY: the `discover` stage generates
# <workdir>/reports/schema_<cohort>.md with the real columns and items so this file can be corrected.

version: 0.1

# ---------------------------------------------------------------------------
# 1. Source tables and columns (canonical name -> real name)
# ---------------------------------------------------------------------------
sources:
  inspire:
    status: VERIFY
    marker_tables: [operations]
    tables:
      operations:
        file: operations
        columns:
          op_id: op_id
          subject_id: subject_id
          hadm_id: hadm_id
          age: age
          sex: sex
          weight: weight
          height: height
          asa: asa
          emergency: emop
          department: department
          anesthesia_type: antype
          pcs_code: icd10_pcs
          op_start: opstart_time
          op_end: opend_time
          admission: admission_time
          discharge: discharge_time
          icu_in: icuin_time
          icu_out: icuout_time
          death_inhosp: inhosp_death_time
        optional_columns:          # null = does not exist; set the real name if it appears in schema_inspire.md
          donor_flag: null         # [VERIFY] donors flagged since v1.4.2
          year: null               # [VERIFY] reconstructable year for temporal validation
          discharge_location: null
          limitation: null
      labs:
        file: labs
        columns: {subject_id: subject_id, time: chart_time, item: item_name, value: value}
      ward_vitals:
        file: ward_vitals
        columns: {subject_id: subject_id, time: chart_time, item: item_name, value: value}
      medications:
        file: medications
        columns: {subject_id: subject_id, time: chart_time, drug: drug_name}
        optional_columns: {route: route}
        # Only the first ATC column is required: the lead's copy ships atc_code only (schema 2026-10-24), the data
        # dictionary also lists atc_code2 / atc_code3 (combination products); those are used when present.
        atc_columns: [atc_code, atc_code2, atc_code3]
      diagnosis:
        file: diagnosis
        columns: {subject_id: subject_id, time: chart_time, code: icd10_cm}
    values:
      sex_male: ["M", "m", "1", "Male", "male"]
      emergency_true: ["1", "1.0", "Y", "y", "True", "true", "E"]
      donor_true: ["1", "1.0", "Y", "y", "True", "true"]
    devices:                       # in ward_vitals; vent, crrt, ecmo, iabp seen in schema_inspire (2026-10-24)
      mode: runs                   # runs = one record per active time point; ends after a gap ≥ support_gap_hours
      items:
        vent: [vent, mv, ventilator]
        rrt: [crrt, rrt, hd, cvvh]
        ecmo: [ecmo]
        iabp: [iabp]
    transfusion_drug_regex: "(?i)(\\bRBC\\b|red blood|packed red|prbc|적혈구)"   # [VERIFY] not among the top drug names
    # medications.route = po / iv / ex (data dictionary): "ex" (external, e.g. topical epinephrine) feeds neither the
    # ATC inputs nor the vasopressor support, as local products in MIMIC-IV / eICU (AUDIT D4) [VERIFY values]
    route_exclude_regex: '(?i)^ex'
    # GCS is charted by component: the total is E + M + V charted at the same time (same rule as MIMIC-IV)
    gcs_component_items: [gcs_e, gcs_m, gcs_v]
    dx_code_length: 3
    # D5: chronic dialysis before the index surgery = ESRD / dialysis-dependence codes (full ICD-10, normalised)
    # or any RRT device record, both timestamped before the surgery start [VERIFY codes]
    chronic_rrt_dx_regex: '^(N18[56]|Z992|Z49)'

  mimic:
    status: VERIFY
    marker_tables: [hosp/admissions, icu/icustays]
    tables:
      admissions:
        file: hosp/admissions
        columns: {subject_id: subject_id, hadm_id: hadm_id, admittime: admittime, dischtime: dischtime,
                  deathtime: deathtime, admission_type: admission_type, admission_location: admission_location,
                  discharge_location: discharge_location, hospital_expire_flag: hospital_expire_flag}
      patients:
        file: hosp/patients
        columns: {subject_id: subject_id, gender: gender, anchor_age: anchor_age, anchor_year: anchor_year}
        optional_columns: {anchor_year_group: anchor_year_group}
      icustays:
        file: icu/icustays
        columns: {subject_id: subject_id, hadm_id: hadm_id, stay_id: stay_id, intime: intime, outtime: outtime,
                  first_careunit: first_careunit}
      transfers:                   # ICU episodes are rebuilt from true ICU careunits (AUDIT D3)
        file: hosp/transfers
        columns: {subject_id: subject_id, hadm_id: hadm_id, transfer_id: transfer_id, eventtype: eventtype,
                  careunit: careunit, intime: intime, outtime: outtime}
      services:
        file: hosp/services
        columns: {subject_id: subject_id, hadm_id: hadm_id, transfertime: transfertime, curr_service: curr_service}
      procedures_icd:
        file: hosp/procedures_icd
        columns: {subject_id: subject_id, hadm_id: hadm_id, seq_num: seq_num, chartdate: chartdate,
                  icd_code: icd_code, icd_version: icd_version}
      labevents:
        file: hosp/labevents
        columns: {subject_id: subject_id, hadm_id: hadm_id, itemid: itemid, charttime: charttime, valuenum: valuenum}
        optional_columns: {specimen_id: specimen_id, value: value}   # blood-gas specimen type (AUDIT D13)
      chartevents:
        file: icu/chartevents
        columns: {subject_id: subject_id, hadm_id: hadm_id, stay_id: stay_id, itemid: itemid,
                  charttime: charttime, valuenum: valuenum}
      inputevents:
        file: icu/inputevents
        columns: {subject_id: subject_id, hadm_id: hadm_id, stay_id: stay_id, itemid: itemid,
                  starttime: starttime, endtime: endtime}
      procedureevents:
        file: icu/procedureevents
        columns: {subject_id: subject_id, hadm_id: hadm_id, stay_id: stay_id, itemid: itemid,
                  starttime: starttime, endtime: endtime}
      code_status:                 # same file as chartevents, text value of the Code Status item (D12)
        file: icu/chartevents
        columns: {hadm_id: hadm_id, itemid: itemid, charttime: charttime, value: value}
      emar:
        file: hosp/emar
        columns: {subject_id: subject_id, hadm_id: hadm_id, charttime: charttime, medication: medication,
                  event_txt: event_txt}
      d_items:
        file: icu/d_items
        columns: {itemid: itemid, label: label}
      d_labitems:
        file: hosp/d_labitems
        columns: {itemid: itemid, label: label}
    emar_administered_events: ["Administered", "Partial Administered", "Started", "Restarted", "Applied", "Confirmed"]
    support_items:                 # [VERIFY] against d_items
      vent: {table: procedureevents, items: [225792]}
      vaso: {table: inputevents, items: [221906, 221289, 221749, 222315, 221662]}
      rrt:  {table: procedureevents, items: [225802, 225803, 225805, 225809, 225955, 225441]}
    transfusion_items: {table: inputevents, items: [225168]}   # PRBC, inside the ICU only [VERIFY]
    transfusion_drug_regex: "(?i)(red blood cell|packed red|\\bprbc\\b)"
    gcs_component_items: [220739, 223900, 223901]
    # D13: blood gases (variables with arterial_only) are kept only for specimens whose type is arterial
    blood_gas_specimen: {item: 52033, arterial_regex: '(?i)^\s*ART'}
    # D12: limitation of life-sustaining treatment = a Code Status record other than full code [VERIFY values]
    limitation: {items: [223758], value_regex: '(?i)(dnr|dnar|dni|do not (attempt )?resus|do not intub|comfort|\bcmo\b|cpr not indicated)'}
    # D5: dialysis procedures dated before the ICU admission day (ICD-9 39.95, ICD-10-PCS 5A1D…) [VERIFY]
    chronic_rrt_procedure_regex: '^(3995|5A1D)'
    # D6: hospitalizations without any eMAR record are unobservable for medication (inputs and mild components)
    medication_coverage: tracked

  eicu:
    status: VERIFY
    marker_tables: [patient, apachePatientResult]
    tables:
      patient:
        file: patient
        columns: {unit_id: patientunitstayid, hosp_id: patienthealthsystemstayid, subject_id: uniquepid,
                  gender: gender, age: age, admission_height: admissionheight, admission_weight: admissionweight,
                  hospital_admit_offset: hospitaladmitoffset, hospital_admit_source: hospitaladmitsource,
                  hospital_discharge_offset: hospitaldischargeoffset, hospital_discharge_status: hospitaldischargestatus,
                  hospital_discharge_location: hospitaldischargelocation, hospital_discharge_year: hospitaldischargeyear,
                  unit_admit_source: unitadmitsource, unit_visit_number: unitvisitnumber,
                  unit_discharge_offset: unitdischargeoffset, unit_discharge_status: unitdischargestatus,
                  unit_discharge_location: unitdischargelocation}
      admissiondx:
        file: admissionDx
        columns: {unit_id: patientunitstayid, path: admitdxpath}
      apachepatientresult:
        file: apachePatientResult
        columns: {unit_id: patientunitstayid, apache_version: apacheversion, predicted_hospital_los: predictedhospitallos}
      apachepredvar:
        file: apachePredVar
        columns: {unit_id: patientunitstayid, elective_surgery: electivesurgery}
      lab:
        file: lab
        columns: {unit_id: patientunitstayid, offset: labresultoffset, item: labname, value: labresult}
      vitalperiodic:
        file: vitalPeriodic
        columns: {unit_id: patientunitstayid, offset: observationoffset, heartrate: heartrate,
                  respiration: respiration, sao2: sao2, temperature: temperature, systemicmean: systemicmean}
      vitalaperiodic:
        file: vitalAperiodic
        columns: {unit_id: patientunitstayid, offset: observationoffset, noninvasivemean: noninvasivemean}
      respiratorycharting:
        file: respiratoryCharting
        columns: {unit_id: patientunitstayid, offset: respchartoffset, label: respchartvaluelabel, value: respchartvalue}
      nursecharting:
        file: nurseCharting
        columns: {unit_id: patientunitstayid, offset: nursingchartoffset, name: nursingchartcelltypevalname,
                  value: nursingchartvalue}
      infusiondrug:
        file: infusionDrug
        columns: {unit_id: patientunitstayid, offset: infusionoffset, drug: drugname}
      respiratorycare:
        file: respiratoryCare
        columns: {unit_id: patientunitstayid, vent_start: ventstartoffset, vent_end: ventendoffset}
      treatment:
        file: treatment
        columns: {unit_id: patientunitstayid, offset: treatmentoffset, text: treatmentstring}
      medication:
        file: medication
        optional_columns: {route: routeadmin}
        columns: {unit_id: patientunitstayid, start: drugstartoffset, stop: drugstopoffset, drug: drugname,
                  cancelled: drugordercancelled}
      diagnosis:
        file: diagnosis
        columns: {unit_id: patientunitstayid, offset: diagnosisoffset, icd: icd9code}
      careplangeneral:             # D12: care limitation records with their offset
        file: carePlanGeneral
        columns: {unit_id: patientunitstayid, offset: cplitemoffset, group: cplgroup, value: cplitemvalue}
    values:
      sex_male: ["Male"]
      expired: ["Expired"]
      age_top_coded: {"> 89": 90}
      apache_version: ["IVa", "IV"]
      cancelled_true: ["Yes"]
    support_patterns:              # [VERIFY]
      vaso_infusion_regex: "(?i)(norepinephrine|levophed|epinephrine|adrenalin|phenylephrine|neo-?synephrine|vasopressin|dopamine)"
      treatment:
        vent: "(?i)mechanical ventilation"
        rrt: "(?i)(dialysis|crrt|cvvh|ultrafiltration)"
        vaso: "(?i)vasopressors"
    vitals_columns:                # vitalperiodic/vitalaperiodic column -> harmonized variable
      heartrate: vital_hr
      respiration: vital_rr
      sao2: vital_spo2
      temperature: vital_temp
      systemicmean: vital_map
      noninvasivemean: vital_map
    fio2_labels: ["FiO2", "FIO2 (%)"]
    gcs_names: ["GCS Total"]
    dx_code_regex: "[A-Z][0-9][0-9A-Z]"   # ICD-10 codes inside icd9code ("xxx.x, Ixx.x")
    # D12: any "Care Limitation" item other than full therapy [VERIFY values]
    limitation: {group_regex: '(?i)care limitation', exclude_value_regex: '(?i)full therapy'}
    # D6 (same rule as MIMIC-IV): stays without any medication record are unobservable for medication inputs
    medication_coverage: tracked

# ---------------------------------------------------------------------------
# 2. Measured variables (labs and vital signs) — source, units, transformation and status
# ---------------------------------------------------------------------------
# bounds: values outside the physiological range -> null. transform: see data/common.py::TRANSFORMS
variables:
  lab_creatinine:
    units: mg/dL
    bounds: [0.1, 25]
    sources:
      inspire: {table: labs, items: [creatinine], status: VERIFIED}
      mimic:   {table: labevents, items: [50912], status: VERIFY}
      eicu:    {table: lab, items: [creatinine], status: VERIFIED}
  lab_hb:
    units: g/dL
    bounds: [2, 25]
    sources:
      inspire: {table: labs, items: [hb], status: VERIFIED}
      mimic:   {table: labevents, items: [51222], status: VERIFY}
      eicu:    {table: lab, items: [Hgb], status: VERIFIED}
  lab_wbc:
    units: 10^3/uL
    bounds: [0.05, 300]
    sources:
      inspire: {table: labs, items: [wbc], status: VERIFIED}
      mimic:   {table: labevents, items: [51301, 51300], status: VERIFY}
      eicu:    {table: lab, items: ["WBC x 1000"], status: VERIFIED}
  lab_plt:
    units: 10^3/uL
    bounds: [1, 2000]
    sources:
      inspire: {table: labs, items: [platelet], status: VERIFIED}
      mimic:   {table: labevents, items: [51265], status: VERIFY}
      eicu:    {table: lab, items: ["platelets x 1000"], status: VERIFIED}
  lab_lactate:
    units: mmol/L
    bounds: [0.1, 30]
    sources:
      inspire: {table: labs, items: [lacate, lactate], status: VERIFIED}   # "lacate" (sic) in INSPIRE
      mimic:   {table: labevents, items: [50813], status: VERIFY}
      eicu:    {table: lab, items: [lactate], status: VERIFIED}
  lab_bilirubin:
    units: mg/dL
    bounds: [0.05, 60]
    sources:
      inspire: {table: labs, items: [total_bilirubin], status: VERIFIED}
      mimic:   {table: labevents, items: [50885], status: VERIFY}
      eicu:    {table: lab, items: ["total bilirubin"], status: VERIFIED}
  lab_albumin:
    units: g/dL
    bounds: [0.5, 7]
    sources:
      inspire: {table: labs, items: [albumin], status: VERIFIED}
      mimic:   {table: labevents, items: [50862], status: VERIFY}
      eicu:    {table: lab, items: [albumin], status: VERIFIED}
  lab_ph:
    units: pH
    bounds: [6.5, 8.0]
    sources:
      inspire: {table: labs, items: [ph], status: VERIFIED}
      mimic:   {table: labevents, items: [50820], arterial_only: true, status: VERIFY}
      eicu:    {table: lab, items: [pH], status: VERIFIED}
  lab_pco2:
    units: mmHg
    bounds: [5, 200]
    sources:
      inspire: {table: labs, items: [paco2], status: VERIFIED}
      mimic:   {table: labevents, items: [50818], arterial_only: true, status: VERIFY}
      eicu:    {table: lab, items: [paCO2], status: VERIFIED}
  lab_po2:
    units: mmHg
    bounds: [10, 700]
    sources:
      inspire: {table: labs, items: [pao2], status: VERIFIED}
      mimic:   {table: labevents, items: [50821], arterial_only: true, status: VERIFY}
      eicu:    {table: lab, items: [paO2], status: VERIFIED}
  vital_hr:
    units: bpm
    bounds: [10, 300]
    sources:
      inspire: {table: ward_vitals, items: [hr], status: VERIFIED}
      mimic:   {table: chartevents, items: [220045], status: VERIFY}
      eicu:    {table: vitalperiodic, items: [heartrate], status: VERIFY}
  vital_map:
    units: mmHg
    bounds: [10, 250]
    sources:
      inspire: {table: ward_vitals, items: [nibp_mbp], status: VERIFIED}   # charted ~1/3 as often as nibp_sbp
      mimic:   {table: chartevents, items: [220052, 220181], status: VERIFY}
      eicu:    {table: vitalperiodic, items: [systemicmean, noninvasivemean], status: VERIFY}
  vital_rr:
    units: breaths/min
    bounds: [2, 80]
    sources:
      inspire: {table: ward_vitals, items: [rr], status: VERIFIED}
      mimic:   {table: chartevents, items: [220210], status: VERIFY}
      eicu:    {table: vitalperiodic, items: [respiration], status: VERIFY}
  vital_spo2:
    units: "%"
    bounds: [30, 100]
    sources:
      inspire: {table: ward_vitals, items: [spo2], status: VERIFIED}
      mimic:   {table: chartevents, items: [220277], status: VERIFY}
      eicu:    {table: vitalperiodic, items: [sao2], status: VERIFY}
  vital_temp:
    units: °C
    bounds: [25, 45]
    sources:
      inspire: {table: ward_vitals, items: [bt], status: VERIFIED}
      mimic:   {table: chartevents, items: [223762], status: VERIFY}
      eicu:    {table: vitalperiodic, items: [temperature], status: VERIFY}
  vital_temp_f:                    # converted to vital_temp
    units: °F
    rename_to: vital_temp
    transform: f_to_c
    bounds: [25, 45]            # applied AFTER the F→C transform, so in °C (AUDIT D2)
    sources:
      mimic:   {table: chartevents, items: [223761], status: VERIFY}
  vital_fio2:
    units: "%"
    bounds: [21, 100]
    transform: fraction_to_percent
    sources:
      inspire: {table: ward_vitals, items: [fio2], status: VERIFIED}
      mimic:   {table: chartevents, items: [223835], status: VERIFY}
      eicu:    {table: respiratorycharting, items: ["FiO2", "FIO2 (%)"], status: VERIFIED}
  vital_gcs:
    units: points
    bounds: [3, 15]
    sources:
      inspire: {table: ward_vitals, items: [gcs_e, gcs_m, gcs_v], aggregate: sum_same_time, status: VERIFIED}
      mimic:   {table: chartevents, items: [220739, 223900, 223901], aggregate: sum_same_time, status: VERIFY}
      eicu:    {table: nursecharting, items: ["GCS Total"], status: VERIFY}
  anthro_weight:
    units: kg
    bounds: [25, 350]
    sources:
      mimic:   {table: chartevents, items: [226512], status: VERIFY}
  anthro_height:
    units: cm
    bounds: [120, 230]
    sources:
      mimic:   {table: chartevents, items: [226730], status: VERIFY}

# Most recent preoperative labs (before the start of the index surgery): the labs above are reused.
preop_labs: [lab_creatinine, lab_hb, lab_wbc, lab_plt, lab_albumin, lab_bilirubin]

# ---------------------------------------------------------------------------
# 3. Medication: INSPIRE ships ATC codes; MIMIC-IV and eICU are mapped by name (regex) [VERIFY]
# ---------------------------------------------------------------------------
medications:
  atc_feature_level_chars: 4       # ATC level 3 = 4 characters (e.g. J01C)
  antibiotic_prefix: J01
  vasopressor_atc: [C01CA03, C01CA24, C01CA04, C01CA06, H01BA01]
  # Drug NAMES (MIMIC-IV eMAR, eICU orders) only feed ATC inputs and the antibiotic course. Vasopressor SUPPORT
  # comes only from IV infusion sources (inputevents, infusionDrug, treatment) — AUDIT D4. Local / topical /
  # ophthalmic / otic / nasal / inhaled products and flushes are excluded before mapping. [VERIFY]
  name_exclude_regex: '(?i)(lidocaine|lidocain|xylocaine|bupivacaine|ropivacaine|mepivacaine|racepinephrine|ophth|\beye\b|\botic\b|\bear\b|nasal|inhal|\bneb\b|nebul|ointment|\boint\b|cream|\bgel\b|topical|lotion|drops|irrigation|flush|\block\b|vaginal|patch)'
  # eICU medication.routeadmin values that are not systemic [VERIFY]
  route_exclude_regex: '(?i)(topical|ophth|\beye\b|\botic\b|\bear\b|nasal|inhal|\bneb|vaginal|transdermal|irrig)'
  name_to_atc:                     # evaluated on unique names; one name can map to several ATC codes
    - {pattern: "(?i)cefazolin", atc: J01DB04}
    - {pattern: "(?i)cephalexin|cefalexin", atc: J01DB01}
    - {pattern: "(?i)cefuroxime", atc: J01DC02}
    - {pattern: "(?i)cefoxitin", atc: J01DC01}
    - {pattern: "(?i)ceftriaxone", atc: J01DD04}
    - {pattern: "(?i)ceftazidime", atc: J01DD02}
    - {pattern: "(?i)cefpodoxime", atc: J01DD13}
    - {pattern: "(?i)cefepime", atc: J01DE01}
    - {pattern: "(?i)ceftaroline", atc: J01DI02}
    - {pattern: "(?i)meropenem", atc: J01DH02}
    - {pattern: "(?i)ertapenem", atc: J01DH03}
    - {pattern: "(?i)imipenem", atc: J01DH51}
    - {pattern: "(?i)aztreonam", atc: J01DF01}
    - {pattern: "(?i)piperacillin", atc: J01CR05}
    - {pattern: "(?i)ampicillin.*sulbactam|unasyn", atc: J01CR01}
    - {pattern: "(?i)amoxicillin.*clav|augmentin", atc: J01CR02}
    - {pattern: "(?i)^(?!.*sulbactam).*ampicillin", atc: J01CA01}
    - {pattern: "(?i)^(?!.*clav).*amoxicillin", atc: J01CA04}
    - {pattern: "(?i)nafcillin", atc: J01CF06}
    - {pattern: "(?i)oxacillin", atc: J01CF04}
    - {pattern: "(?i)penicillin", atc: J01CE01}
    - {pattern: "(?i)^(?!.*(oral|po\\b|enema)).*vancomycin", atc: J01XA01}
    - {pattern: "(?i)vancomycin.*(oral|po\\b)", atc: A07AA09}
    - {pattern: "(?i)daptomycin", atc: J01XX09}
    - {pattern: "(?i)linezolid", atc: J01XX08}
    - {pattern: "(?i)^(?!.*(oral|po\\b|vaginal|gel|cream)).*metronidazole", atc: J01XD01}
    - {pattern: "(?i)metronidazole.*(oral|po\\b)", atc: P01AB01}
    - {pattern: "(?i)levofloxacin", atc: J01MA12}
    - {pattern: "(?i)ciprofloxacin", atc: J01MA02}
    - {pattern: "(?i)moxifloxacin", atc: J01MA14}
    - {pattern: "(?i)gentamicin", atc: J01GB03}
    - {pattern: "(?i)tobramycin", atc: J01GB01}
    - {pattern: "(?i)amikacin", atc: J01GB06}
    - {pattern: "(?i)azithromycin", atc: J01FA10}
    - {pattern: "(?i)erythromycin", atc: J01FA01}
    - {pattern: "(?i)clindamycin", atc: J01FF01}
    - {pattern: "(?i)doxycycline", atc: J01AA02}
    - {pattern: "(?i)minocycline", atc: J01AA08}
    - {pattern: "(?i)tigecycline", atc: J01AA12}
    - {pattern: "(?i)sulfamethoxazole|trimethoprim|bactrim", atc: J01EE01}
    - {pattern: "(?i)nitrofurantoin", atc: J01XE01}
    - {pattern: "(?i)colistin|polymyxin", atc: J01XB01}
    - {pattern: "(?i)norepinephrine|levophed", atc: C01CA03}
    - {pattern: "(?i)^(?!.*nor).*epinephrine|adrenalin", atc: C01CA24}
    - {pattern: "(?i)phenylephrine|neo-?synephrine", atc: C01CA06}
    - {pattern: "(?i)vasopressin", atc: H01BA01}
    - {pattern: "(?i)dopamine", atc: C01CA04}
    - {pattern: "(?i)dobutamine", atc: C01CA07}
    - {pattern: "(?i)milrinone", atc: C01CE02}
    - {pattern: "(?i)amiodarone", atc: C01BD01}
    - {pattern: "(?i)digoxin", atc: C01AA05}
    - {pattern: "(?i)heparin", atc: B01AB01}
    - {pattern: "(?i)enoxaparin", atc: B01AB05}
    - {pattern: "(?i)warfarin", atc: B01AA03}
    - {pattern: "(?i)apixaban", atc: B01AF02}
