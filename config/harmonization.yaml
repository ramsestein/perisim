# ---------------------------------------------------------------------------
# 4. Harmonized surgical group (nominal, VDM)
# ---------------------------------------------------------------------------
surgical_groups:
  inspire_department:              # [VERIFY] SNUH service codes
    CS: cardiac
    TS: thoracic
    CTS: cardiac
    GS: general_gi
    NS: neuro
    OS: ortho
    UR: uro_gyn
    OG: uro_gyn
    OB: uro_gyn
    GY: uro_gyn
    OL: ent_head_neck
    ENT: ent_head_neck
    PS: plastic_other
    EY: plastic_other
    DT: ent_head_neck
    VS: vascular
    TR: general_gi
  mimic_service:
    CSURG: cardiac
    TSURG: thoracic
    VSURG: vascular
    NSURG: neuro
    SURG: general_gi
    TRAUM: general_gi
    ORTHO: ortho
    GU: uro_gyn
    GYN: uro_gyn
    OBS: uro_gyn
    ENT: ent_head_neck
    DENT: ent_head_neck
    PSURG: plastic_other
  # Evaluated only on the specific "Operative|Diagnosis|<system>|<dx>" rows; the FIRST matching pattern wins and,
  # per unit, the highest-priority (lowest index) match is kept, so the result never depends on row order (D11).
  eicu_admitdx_row_regex: '(?i)\|Operative\|Diagnosis\|'
  eicu_admitdx_regex:              # [VERIFY]
    - {pattern: "(?i)CABG|valve|aortic root|cardiac|heart transplant|ventricular assist", group: cardiac}
    - {pattern: "(?i)\\|Respiratory\\||thoracotomy|lobectomy|pneumonectomy|esophag", group: thoracic}
    - {pattern: "(?i)aneurysm|endarterectomy|bypass graft|(?<!cardio)vascular|embolectomy|amputation", group: vascular}
    - {pattern: "(?i)\\|Neurologic\\||craniotomy|spinal|laminectomy", group: neuro}
    - {pattern: "(?i)\\|Gastrointestinal\\||bowel|colectomy|whipple|liver|pancrea|gastrectomy|cholecyst", group: general_gi}
    - {pattern: "(?i)\\|Musculoskeletal|fracture|hip|knee|orthopedic", group: ortho}
    - {pattern: "(?i)\\|Genitourinary\\||nephrectomy|cystectomy|hysterectomy|prostat|renal transplant", group: uro_gyn}
    - {pattern: "(?i)head and neck|neck dissection|laryn|thyroid", group: ent_head_neck}
    - {pattern: "(?i)\\|Operative\\|", group: plastic_other}

