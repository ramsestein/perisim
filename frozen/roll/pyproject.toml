[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perisim"
version = "0.3.0"
description = "PERISIM: kNN with a learned metric (multi-model SAGE + regularised diagonal NCA) for postoperative patients at ICU discharge"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ramses Marrero García" }]

[project.scripts]
perisim = "perisim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
