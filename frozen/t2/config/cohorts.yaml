# Inclusion and exclusion criteria per cohort (§3, proposal v0).
# This file holds criterion VALUES; the original column names live in harmonization.yaml.

common:
  min_age: 18
  min_icu_hours: 4               # D3 [open decision]
  icu_death_tolerance_min: 60    # death ≤ ICU discharge + tolerance ⇒ death in the ICU
  discharge_tolerance_min: 60    # hospital discharge ≤ ICU discharge + tolerance ⇒ direct discharge from the ICU (excluded)
  exclude_organ_donors: true
  exclude_known_limitation: true # timestamped records ≤ cutoff (MIMIC-IV Code Status, eICU carePlanGeneral) — D12
  # t0 must be a discharge to the ward (AUDIT C5): stays followed within N h by an OR / PACU / IR / ICU entry are
  # excluded (MIMIC-IV: hosp.transfers; INSPIRE: next operation start; eICU: next unit stay of the hospitalization)
  return_exclusion_hours: 6

inspire:
  role: development
  # icuin_time within the 24 h following opend_time (§3.1). Negative tolerance for recording misalignments.
  postop_window_hours: 24
  postop_negative_tolerance_min: 60

mimic:
  role: external_full
  # Surgery = timestamped operating-room evidence (AUDIT D1/D8, decided 2026-10-22): an OR/PACU transfer in
  # hosp.transfers ending within `or_window_hours` before the ICU admission. Hospitalizations WITHOUT any OR/PACU
  # transfer fall back to a "major therapeutic" procedure code on the ICU admission day or the day before (HCUP
  # procedure classes if `hcup_pclass_files` are provided, otherwise the approximation below). A surgical service
  # alone no longer qualifies (it is only counted as "service_only" in the flow).
  postop_rule: or_evidence              # or_evidence | service_or_procedure (v0, sensitivity only)
  or_careunits: ["PACU"]                # [VERIFY values in schema_mimic.md]
  or_window_hours: 24
  or_tolerance_min: 60                  # OR/PACU exit may be recorded up to this long after the ICU admission
  service_lookback_min: 60              # service in effect at intime + 60 min (descriptive / v0 rule)
  surgical_services: [CSURG, NSURG, ORTHO, PSURG, SURG, TSURG, VSURG, GU, GYN, ENT, TRAUM, DENT]
  procedure_days_before: 1              # fallback: procedure on the ICU admission date or the day before
  # Optional HCUP Procedure Classes (class 4 = major therapeutic), CSV paths relative to the repository root with
  # columns code,class. Not shipped: until provided, the fallback uses the approximation below (declared).
  hcup_pclass_files: {icd9: null, icd10: null}
  # C5: careunits that count as a return to the OR / IR after the ICU exit (ICU careunits always count)
  return_careunits: ["PACU"]
  # True ICU careunits of hosp.transfers (step-down / intermediate units are NOT ICU) — AUDIT D3 [VERIFY values]
  icu_careunits:
    - "Medical Intensive Care Unit (MICU)"
    - "Surgical Intensive Care Unit (SICU)"
    - "Medical/Surgical Intensive Care Unit (MICU/SICU)"
    - "Cardiac Vascular Intensive Care Unit (CVICU)"
    - "Coronary Care Unit (CCU)"
    - "Neuro Surgical Intensive Care Unit (Neuro SICU)"
    - "Trauma SICU (TSICU)"
  icu_episode_merge_gap_min: 60         # consecutive ICU transfers closer than this form one ICU episode
  # Surgical ICD-10-PCS [VERIFY]: section "0" (medical-surgical), approach (5th character)
  # open (0) or percutaneous endoscopic (4), excluding root operation "2" (change).
  or_icd10_approaches: ["0", "4"]
  or_icd10_exclude_root_operations: ["2"]
  # ICD-9-CM: chapters 01–86, excluding frequent non-surgical prefixes [VERIFY]
  or_icd9_range: [1, 86]
  # Bedside / diagnostic procedures excluded from the approximation (AUDIT D1): vascular and dialysis catheters,
  # haemodialysis, bronchoscopy, laryngoscopy, EGD/colonoscopy, PEG, chest tube, thoracentesis, paracentesis,
  # lumbar puncture / spinal catheters, urinary catheter, diagnostic cardiac catheterization, temporary
  # tracheostomy, percutaneous biopsies [VERIFY]
  or_icd9_exclude_prefixes: ["389", "3995", "3891", "3893", "3895", "3321", "3322", "3323", "3324", "3142", "4513",
                             "4516", "4523", "4525", "4413", "4311", "3404", "3491", "5491", "0331", "0390", "0391",
                             "0392", "5794", "3721", "3722", "3723", "311", "4131", "5011", "5523"]
  emergency_admission_types: ["EW EMER.", "URGENT", "DIRECT EMER.", "EMERGENCY"]

eicu:
  role: external_partial                # severe / not severe and length of stay only (§2.1)
  postop_admit_sources: ["Operating Room", "Recovery Room", "PACU"]
  postop_admitdx_patterns: ["(?i)\\|Operative\\|", "(?i)admitted from the O\\.R\\.[^|]*\\|Yes"]
  ward_discharge_locations: ["Floor", "Step-Down Unit (SDU)", "Telemetry", "Acute Care/Floor", "Other Internal"]
